<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 276" role="img" aria-labelledby="title desc">
  <title id="title">Champignon vectoriel</title>
  <desc id="desc">Illustration simple d'un champignon à chapeau brun et pied beige, avec quelques brins d'herbe.</desc>

  <!-- Chapeau brun -->
  <!-- Le bord inférieur suit exactement la ligne de la partie claire
       afin qu'aucun débordement brun ne soit visible sur les côtés. -->
  <path d="M7 104
           C3 82 8 61 19 44
           C42 16 76 1 112 0
           C151 0 186 13 211 38
           C228 55 235 78 234 99
           C234 103 231 107 228 108
           C208 99 188 93 164 91
           C137 88 108 87 78 89
           C53 91 30 95 7 104 Z"
        fill="#7a4d2b"/>

  <!-- Partie inférieure claire du chapeau -->
  <path d="M7 104
           C30 95 53 91 78 89
           C108 87 137 88 164 91
           C188 93 208 99 228 108
           C222 120 207 123 190 121
           C171 118 151 113 131 112
           C105 110 83 113 61 118
           C38 123 19 118 7 104 Z"
        fill="#e8dcc7"/>

  <!-- Lignes douces des lamelles -->
  <g fill="none" stroke="#d6c6aa" stroke-width="1" opacity=".65">
    <path d="M34 106 C50 103 63 101 78 101"/>
    <path d="M46 111 C59 107 72 106 87 106"/>
    <path d="M151 103 C170 103 187 106 204 112"/>
    <path d="M163 107 C179 108 193 112 207 117"/>
  </g>

  <!-- Pied -->
  <path d="M72 112
           C68 133 62 154 57 177
           C52 200 48 221 50 239
           C52 250 65 254 85 255
           C111 257 145 256 167 249
           C188 242 193 235 193 224
           C193 202 187 181 182 160
           C177 141 171 125 164 111
           C138 108 103 108 72 112 Z"
        fill="#dfcfb5"/>

  <!-- Ombre douce du pied -->
  <path d="M72 112
           C67 139 60 166 54 195
           C50 216 49 233 53 243
           C61 250 75 252 88 253
           C80 229 79 202 82 175
           C84 149 88 127 94 111 Z"
        fill="#d6c4a7" opacity=".5"/>

  <!-- Herbes : forme courte et souple, au plus près de la référence -->
  <g fill="#3f7047">
    <!-- touffe gauche -->
    <path d="M54 253 C46 239 34 219 21 208 C22 215 31 226 42 240 C47 246 51 251 54 253 Z"/>
    <path d="M51 254 C42 245 33 238 24 234 C27 239 37 246 49 253 Z"/>
    <path d="M55 254 C52 242 52 230 54 218 C57 228 58 241 57 253 Z"/>
    <path d="M58 254 C58 239 61 227 66 217 C66 229 63 242 60 254 Z"/>
    <path d="M62 254 C66 241 72 231 79 225 C74 237 68 247 63 254 Z"/>
    <path d="M65 255 C72 247 79 242 87 239 C80 246 72 252 66 255 Z"/>

    <!-- touffe droite -->
    <path d="M168 254 C165 241 163 229 164 218 C168 229 171 241 171 253 Z"/>
    <path d="M170 254 C173 240 178 227 184 218 C181 232 176 245 171 254 Z"/>
    <path d="M174 254 C181 241 190 231 198 227 C191 238 182 248 175 254 Z"/>
    <path d="M169 254 C165 246 160 240 156 236 C161 239 166 244 171 252 Z"/>
    <path d="M175 254 C183 249 191 245 200 243 C192 248 183 252 176 255 Z"/>
  </g>

  </svg>
