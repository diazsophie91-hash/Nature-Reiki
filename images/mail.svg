<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#506d32"/>
      <stop offset="1" stop-color="#46622d"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a03e72"/>
      <stop offset="1" stop-color="#963463"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <!-- Cadre vert : une seule géométrie -->
  <rect x="395" y="278" width="745" height="466" rx="43" fill="url(#green)"/>

  <!-- Forme mauve complète : coins + bord supérieur + V,
       sans superposition de traits arrondis -->
  <path d="
    M 453 278
    H 1082
    Q 1140 278 1140 336
    Q 1140 350 1127 359
    L 785 604
    Q 766 618 747 604
    L 408 359
    Q 395 350 395 336
    Q 395 278 453 278
    Z"
    fill="url(#magenta)"/>

  <!-- Corps blanc inférieur -->
  <path d="
    M 429 349
    L 747 592
    Q 766 606 785 592
    L 1106 349
    V 686
    Q 1106 710 1082 710
    H 453
    Q 429 710 429 686
    Z"
    fill="url(#paper)"/>

  <!-- Partie blanche supérieure de l'enveloppe -->
  <path d="M 441 313 H 1094 L 766 560 Z" fill="url(#paper)"/>
</svg>
