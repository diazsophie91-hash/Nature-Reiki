<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a83c70"/>
    <stop offset="0.48" stop-color="#a93f70"/>
    <stop offset="1" stop-color="#87315e"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffefa"/>
    <stop offset="0.48" stop-color="#fdfdfd"/>
    <stop offset="1" stop-color="#f8f8f8"/>
  </linearGradient>
  <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e9e9e9" stop-opacity="0.38"/>
    <stop offset="0.55" stop-color="#f4f4f4" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b823b"/>
    <stop offset="1" stop-color="#466d2e"/>
  </linearGradient>
  <clipPath id="screenClip">
    <rect x="242" y="197" width="540" height="1141" rx="62"/>
  </clipPath>
</defs>

<!-- side buttons -->
<rect x="188" y="376" width="24" height="98" rx="9" fill="url(#green)"/>
<rect x="188" y="500" width="24" height="98" rx="9" fill="url(#green)"/>
<rect x="814" y="435" width="24" height="123" rx="9" fill="url(#green)"/>

<!-- phone body -->
<rect x="207" y="162" width="610" height="1212" rx="104" fill="url(#body)"/>

<!-- screen -->
<rect x="242" y="197" width="540" height="1141" rx="62" fill="url(#screen)"/>

<!-- subtle diagonal screen reflection -->
<path d="M242 197H300L782 1170V1338H242Z" fill="url(#reflection)" clip-path="url(#screenClip)"/>

<!-- top camera/speaker -->
<rect x="443" y="219" width="119" height="28" rx="14" fill="url(#green)"/>
<circle cx="601" cy="232" r="16" fill="url(#green)"/>
</svg>